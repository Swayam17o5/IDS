version: '3.8'

services:
  nids-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_nids_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./nids.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./nids.db:/app/nids.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
